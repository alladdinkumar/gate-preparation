name: Build and deploy the planner

on:
  push:
    branches: [main]
    # Progress commits land on main constantly - from the phone and from
    # server.py's auto-push - and none of them change the built site. Without
    # this filter every ticked checkbox would burn an Actions run.
    paths:
      - 'plan/**'
      - 'notes/**'
      - 'daily-logs/TEMPLATE.md'
      - 'reviews/*/TEMPLATE.md'
      - 'webapp/**'
      - '!webapp/progress.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never deploy two builds at once, but let a newer push cancel a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the plan parses and the JS twins still match Python
        run: |
          python webapp/build_site.py
          python webapp/tests/make_fixtures.py
          node webapp/tests/parity.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
